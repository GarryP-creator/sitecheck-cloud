<!DOCTYPE html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiteCheck Cloud by WRM</title>
<meta name="theme-color" content="#14171A">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SC Cloud">
<meta name="description" content="Offline CDM 2015 site checklists, risk assessments and hazard reports.">

<style>
/* ============================================================
   SiteCheck by WRM — CDM 2015 site compliance
   Palette grounded in BS EN ISO 7010 safety signage:
   green = safe condition, red = prohibition, amber = warning,
   blue = mandatory. Pass/Fail/NA inherit real sign semantics.
   No webfonts anywhere — the app must run with no network.
   ============================================================ */
:root{
  --concrete:#E7E5DF;
  --plate:#FBFAF7;
  --ink:#14171A;
  --ink-soft:#5B6068;
  --line:#C9C6BE;
  --hivis:#FFD400;
  --go:#007A33;
  --stop:#C8102E;
  --warn:#E07B00;
  --duty:#0057B8;
  --shadow:0 1px 0 rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);background:var(--concrete);color:var(--ink);
  font-size:16px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* --- hazard tape: the signature device, used only on the header --- */
.tape{
  height:10px;
  background:repeating-linear-gradient(-45deg,var(--hivis) 0 14px,var(--ink) 14px 28px);
}
header.app{background:var(--ink);color:#fff}
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px}
.hd h1{
  margin:0;font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
}
.hd h1 small{display:block;font-size:10px;letter-spacing:.24em;color:var(--hivis);font-weight:700;margin-top:2px}
.mark{width:40px;height:40px;flex:0 0 40px;border-radius:7px;overflow:hidden;display:block}
.mark svg{width:100%;height:100%;display:block}
.hd .right{margin-left:auto;display:flex;align-items:center;gap:10px}
/* masthead tagline — only where there is genuinely room for it */
.tagline{display:none}
@media (min-width:900px){
  /* sits just left of the app name, divided from it by a hi-vis rule */
  .tagline{display:flex;align-items:center;gap:16px;flex:1;justify-content:flex-start;
    margin-left:20px;color:#EDEBE5;font-size:16px;font-weight:700;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden}
  .tagline i{width:3px;height:26px;background:var(--hivis);flex:0 0 3px;border-radius:2px}
  /* shown up top, so drop the one at the foot of the home screen */
  .signoff .tag{display:none}
  .signoff{margin-top:34px}
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--go)}
.dot.off{background:var(--warn)}
.netlabel{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#B9BDC2}
.syncbtn{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:4px;border:1.5px solid #3A3F45}
.syncbtn:active{background:#2A2E33}
.syncbtn:disabled{opacity:.6}
.dot.warn{background:var(--warn)}
.dot.sync{background:var(--duty);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.who{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--hivis);
  text-transform:uppercase;padding:6px 9px;border:1.5px solid #3A3F45;border-radius:4px}
@media (max-width:560px){ .who{display:none} .syncbtn .netlabel{display:none} }
.uid{display:block;text-align:left;font-size:10px;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:#8D939A;margin:0 0 6px}
.lockmsg{text-align:center;color:var(--stop);font-size:12px;font-weight:700;margin:0 0 14px}
.lockbtn{display:flex;align-items:center;gap:7px;color:#fff;padding:8px 12px;border-radius:4px;
  border:1.5px solid #3A3F45;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.lockbtn:active{background:var(--hivis);border-color:var(--hivis);color:var(--ink)}
@media (max-width:430px){ .lockbtn span{display:none} .lockbtn{padding:8px 10px} }

/* --- back bar --- */
.crumb{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:var(--ink);color:#fff;border-top:1px solid #2A2E33;
  position:sticky;top:0;z-index:25;
}
.crumb button{margin:-6px 0 -6px -6px;padding:6px}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-width:0;text-align:left;
  padding:6px;margin:-6px;border-radius:6px;background:none;cursor:pointer}
.brand:active{background:#22262B}
.crumb button{color:var(--hivis);font-weight:700;font-size:14px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.crumb span{font-family:var(--mono);font-size:11px;color:#9AA0A6;margin-left:auto;letter-spacing:.06em}

main{max-width:600px;margin:0 auto;padding:16px 16px 120px}

/* --- stencil section labels --- */
.eyebrow{
  display:flex;align-items:center;gap:10px;
  font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);
  margin:26px 0 12px;
}
.eyebrow::after{content:"";flex:1;height:2px;background:var(--line)}
.eyebrow:first-child{margin-top:6px}

/* --- tiles as signage plates --- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
  background:var(--plate);border-radius:4px;box-shadow:var(--shadow);
  text-align:left;overflow:hidden;display:flex;flex-direction:column;
  min-height:132px;border:1px solid var(--line);
  transition:transform .08s ease;
}
.tile:active{transform:scale(.975)}
.tile .bar{height:6px;background:var(--duty)}
.tile .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tile svg{width:30px;height:30px}
.tile b{font-size:15px;font-weight:800;letter-spacing:.01em;display:block;line-height:1.2}
.tile p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.35}
.tile .count{
  margin-top:auto;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);
}
.tile.wide{grid-column:1 / -1;min-height:0}
.tile.wide .body{flex-direction:row;align-items:center;gap:14px}
.tile.wide .txt{flex:1}

/* --- list rows --- */
.row{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--plate);border:1px solid var(--line);border-radius:4px;
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
}
.row:active{background:#F1EFEA}
.row .code{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
  background:var(--ink);color:var(--hivis);padding:4px 6px;border-radius:3px;flex:0 0 auto;
}
.row .txt{flex:1;min-width:0}
.row b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.row small{display:block;color:var(--ink-soft);font-size:12px;margin-top:3px}
.row .chev{color:var(--ink-soft);flex:0 0 auto}
.row .mini{flex:0 0 auto;border:2px solid var(--ink);border-radius:3px;padding:9px 11px;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.row .mini:active{background:var(--ink);color:var(--hivis)}
.row .tap{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;background:none;padding:0}

/* --- form questions --- */
.q{background:var(--plate);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.q .num{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.08em;display:block;margin-bottom:4px}
.q label.qt{display:block;font-weight:600;font-size:15px;line-height:1.35;margin-bottom:4px}
.talkq{border-left:5px solid #0B7285}
.talkq .why{font-size:13.5px;line-height:1.5;margin:8px 0 4px;color:#2C3136}
.talkq .tsec{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft);margin:16px 0 6px}
.talkq .tlist{margin:0;padding-left:20px;font-size:13.5px;line-height:1.5}
.talkq .tlist li{margin-bottom:7px}
.talkq .tgrid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
@media (min-width:620px) and (max-width:899px){
  .talkq .tgrid{grid-template-columns:1fr 1fr}
  .talkq .tcol{grid-column:1 / -1}
}
/* on a laptop: the talk, then do and do-not, side by side across the page */
@media (min-width:900px){
  .talkq .tgrid{grid-template-columns:1.4fr 1fr 1fr;gap:22px;align-items:start}
  .talkq .why{max-width:80ch;font-size:14.5px}
  .talkq .tcol .tsec{margin-top:0}
  .talkq .ask{columns:2;column-gap:26px}
  .talkq .ask li{break-inside:avoid}
}
.talkq .ddcol{border-radius:4px;padding:12px 14px}
.talkq .ddcol h5{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.talkq .ddcol ul{margin:0;padding-left:17px;font-size:13px;line-height:1.45}
.talkq .ddcol li{margin-bottom:6px}
.talkq .do{background:#EBF5EE;border:1px solid #BEDFC8}
.talkq .do h5{color:var(--go)}
.talkq .dont{background:#FCEBEE;border:1px solid #F2C4CC}
.talkq .dont h5{color:var(--stop)}
.talkq .tref{font-size:11px;color:var(--ink-soft);font-style:italic;margin:14px 0 4px}
.talkq .btn{margin-top:10px}
.q .guide{font-size:12px;color:var(--ink-soft);border-left:3px solid var(--line);padding-left:9px;margin:8px 0 0}
.req{color:var(--stop);font-weight:800}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.seg button{
  border:2px solid var(--line);background:#fff;border-radius:3px;
  padding:14px 4px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);
}
.seg button[aria-pressed="true"][data-v="pass"]{background:var(--go);border-color:var(--go);color:#fff}
.seg button[aria-pressed="true"][data-v="fail"]{background:var(--stop);border-color:var(--stop);color:#fff}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--ink-soft);border-color:var(--ink-soft);color:#fff}

input[type=text],input[type=number],input[type=date],input[type=tel],input[type=password],select,textarea{
  width:100%;padding:13px;border:2px solid var(--line);border-radius:3px;background:#fff;
  margin-top:10px;
}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--duty);outline-offset:1px}
.note{margin-top:10px}
.note input{margin-top:0}

/* risk matrix */
.risk{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:12px}
.risk label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.risk select{margin-top:6px}
.score{
  min-width:76px;text-align:center;padding:11px 8px;border-radius:3px;color:#fff;
  font-family:var(--mono);font-weight:800;font-size:15px;line-height:1.1;
}
.score.med{color:var(--ink)}
.score small{display:block;font-size:9px;letter-spacing:.08em;opacity:.9}

/* repeat rows */
.rep{border:2px dashed var(--line);border-radius:4px;padding:14px;margin-top:14px;background:#fff}
.rep h4{margin:0 0 12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  color:var(--ink-soft);text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rep .del{color:var(--stop);font-size:12px;font-weight:700;margin-top:8px}

/* photos + signature */
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.attach{display:flex;align-items:center;gap:11px;background:#fff;border:2px solid var(--line);
  border-radius:3px;padding:11px 12px;margin-top:10px}
.attach svg{color:var(--duty);flex:0 0 auto}
.attach .txt{flex:1;min-width:0}
.attach b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach small{color:var(--ink-soft);font-size:11px}
.attach button{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--ink);
  color:var(--hivis);font-size:16px;font-weight:700;line-height:1}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:3px;border:2px solid var(--line);display:block}
.thumbs button{position:absolute;top:-7px;right:-7px;background:var(--stop);color:#fff;width:24px;height:24px;border-radius:50%;font-weight:800;font-size:14px;line-height:1}
/* signature: a tappable box, signed in a pop-up so the page still scrolls */
.signwrap{margin-top:10px}
.signbox{width:100%;min-height:84px;background:#fff;border:2px dashed var(--line);border-radius:3px;
  display:flex;align-items:center;justify-content:center;padding:8px}
.signbox.signed{border-style:solid;min-height:0}
.signbox span{display:flex;align-items:center;gap:8px;color:var(--ink-soft);
  font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.signbox img{max-height:74px;max-width:100%;display:block}
.signbox:active{background:#F1EFEA}
.signclear{margin-top:8px;color:var(--stop);font-size:11px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;text-decoration:underline}

.signmodal{position:fixed;inset:0;z-index:90;background:rgba(20,23,26,.72);
  display:flex;align-items:center;justify-content:center;padding:16px}
.signpanel{background:var(--plate);border-radius:6px;border-top:6px solid var(--hivis);
  width:100%;max-width:680px;padding:16px;display:flex;flex-direction:column;gap:12px}
.signhead b{display:block;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.signhead span{font-size:12px;color:var(--ink-soft)}
#padbig{width:100%;height:min(46vh,300px);background:#fff;border:2px solid var(--line);
  border-radius:3px;touch-action:none;display:block;cursor:crosshair}
.signfoot{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.signfoot .btn{padding:14px;margin:0}
@media (orientation:landscape) and (max-height:520px){ #padbig{height:38vh} .signpanel{padding:10px;gap:8px} }

/* buttons */
.btn{
  display:block;width:100%;padding:17px;border-radius:3px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;font-size:14px;text-align:center;
}
.btn.primary{background:var(--ink);color:var(--hivis)}
.btn.go{background:var(--go);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.danger{background:transparent;color:var(--stop);border:2px solid var(--stop)}
.btn:active{opacity:.85}
.btn+.btn{margin-top:10px}

.actionbar{
  position:fixed;left:0;right:0;bottom:0;background:var(--plate);
  border-top:2px solid var(--ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  z-index:20;
}
.actionbar .inner{max-width:600px;margin:0 auto}
.progress{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-soft);
  text-align:center;margin-bottom:9px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.draftnote{color:var(--go)}

/* status pills */
.pill{
  display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:2px;color:#fff;
}
.pill.go{background:var(--go)} .pill.stop{background:var(--stop)}
.pill.warn{background:var(--warn)} .pill.grey{background:var(--ink-soft)}

.empty{text-align:center;padding:48px 20px;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.banner{
  background:#FFF6D6;border:2px solid var(--hivis);border-radius:4px;padding:12px 14px;
  font-size:13px;margin-bottom:16px;
}
.banner b{display:block;margin-bottom:3px}
.sheetwrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheetbg{position:absolute;inset:0;background:rgba(20,23,26,.55)}
.sheetbox{position:relative;background:var(--concrete);width:100%;max-width:600px;
  border-top:5px solid var(--hivis);border-radius:8px 8px 0 0;padding:20px 16px
  calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}
.sheetbox h3{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.sheetnote{font-size:13px;color:var(--ink-soft);margin:0 0 14px;line-height:1.45}
.sheetnote b{color:var(--ink)}
.pick{display:flex;align-items:center;gap:13px;background:var(--plate);border:1px solid var(--line);
  border-radius:4px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.pick:has(input:checked){border-color:var(--ink);border-width:2px;padding:12px 13px}
.pick input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--go);margin:0}
.pick .txt{flex:1;min-width:0}
.pick b{display:block;font-size:14px;line-height:1.25}
.creds{display:flex;align-items:center;gap:14px;background:var(--plate);border:2px solid var(--ink);
  border-radius:4px;padding:14px;margin-bottom:10px}
.creds span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);min-width:70px}
.creds b{font-family:var(--mono);font-size:20px;letter-spacing:.08em}
.pick small{display:block;color:var(--ink-soft);font-size:11px;margin-top:3px}
@media (min-width:700px){ .sheetwrap{align-items:center} .sheetbox{border-radius:8px;border-top-width:5px} }
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:60;
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:3px;font-size:14px;font-weight:600;
  box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:88%;text-align:center;
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
}

/* login */
.lockwrap{background:var(--ink);min-height:100vh}
.login{max-width:360px;margin:0 auto;padding:46px 24px 44px}
.login .mark{width:132px;height:132px;margin:0 auto 28px;border-radius:29px;box-shadow:0 10px 34px rgba(0,0,0,.55)}
.signoff{margin:42px 0 10px;text-align:center}
.signoff .tag{position:relative;margin:0 auto 16px;padding-top:19px;max-width:16em;
  font-size:16px;font-weight:700;line-height:1.4;color:var(--ink)}
.signoff .tag::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:36px;height:3px;background:var(--hivis)}
.signoff .mk{display:flex;align-items:center;justify-content:center;gap:10px;opacity:.45}
.signoff .m{width:24px;height:24px;border-radius:5px;overflow:hidden;flex:0 0 24px}
.signoff .m svg{width:100%;height:100%;display:block}
.signoff .mk span{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.login h2{text-align:center;color:#fff;font-size:21px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 8px}
.login .by{text-align:center;font-size:10px;letter-spacing:.36em;font-weight:800;color:#8D939A;margin:0 0 26px;text-transform:uppercase}
.login .by b{color:var(--hivis)}
.login p.sub{text-align:center;color:#8D939A;font-size:13px;margin:0 0 28px}
.login .strap{text-align:center;color:#E4E2DC;font-size:15px;line-height:1.45;
  margin:0 auto 30px;max-width:17em;position:relative;padding-top:20px}
.login .strap::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:34px;height:3px;background:var(--hivis)}
.pins{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid #5B6068;display:block}
.pins i.on{background:var(--hivis);border-color:var(--hivis)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{background:#22262B;border:1px solid #363B41;color:#fff;border-radius:4px;padding:19px 0;font-size:22px;font-weight:700}
.pad button:active{background:var(--hivis);border-color:var(--hivis);color:var(--ink)}

/* search */
.searchbar{position:relative;margin-bottom:4px}
.searchbar input{margin-top:0;padding-left:42px;border-radius:3px;font-size:16px}
.searchbar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.searchbar .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  padding:8px 12px;color:var(--ink-soft);font-size:19px;font-weight:700}
.where{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:var(--concrete);border:1px solid var(--line);color:var(--ink-soft);padding:3px 6px;border-radius:2px}
.hit small em{font-style:normal;background:#FFF0A8;padding:0 2px}

/* project bar */
.projbar{display:flex;align-items:center;gap:12px;background:var(--plate);border:1px solid var(--line);
  border-left:5px solid var(--hivis);border-radius:4px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.projbar .txt{flex:1;min-width:0}
.projbar b{display:block;font-size:15px;line-height:1.2}
.projbar small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projbar button{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);border:2px solid var(--ink);border-radius:3px;padding:8px 10px;flex:0 0 auto}

/* ---------- larger screens: iPad and desktop ---------- */
@media (min-width:700px) and (max-width:899px){
  main{max-width:760px}
  /* same shape as the desktop layout, slightly tighter */
  .fldgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;align-items:start}
  .fld{min-width:0}
  .fld-textarea,.fld-risk{grid-column:1 / -1}
  .fld-risk{max-width:400px}
  .fldgrid textarea{min-height:112px;line-height:1.5}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .actionbar .inner{max-width:760px}
}
@media (min-width:900px){
  main{max-width:940px}
  /* only forms and lists split into two columns — never the home screen */
  main.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
  main.two>.eyebrow,main.two>.banner,main.two>.signoff,
  main.two>.empty,main.two>.btn,main.two>.wide{grid-column:1 / -1}

  /* Short answers pair up two to a line; anything long — control measures,
     actions, method steps — takes the full width, because that is where the
     reading happens. */
  .fldgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;align-items:start}
  .fld{min-width:0}
  .fld-textarea{grid-column:1 / -1}
  .fld-risk{grid-column:1 / -1;max-width:400px}
  .fld input,.fld textarea{margin-top:6px}
  .fldgrid textarea{min-height:132px;line-height:1.5}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .actionbar .inner{max-width:940px;display:flex;gap:12px;align-items:center}
  .actionbar .inner .progress{margin:0 auto 0 0}
  .actionbar .inner .btn{width:auto;min-width:230px}
  .actionbar .inner .btn+.btn{margin-top:0}
  .q{margin-bottom:16px}
  .login{padding-top:8vh}
}
/* installed to the home screen: pad past the status bar */
.standalone .hd{padding-top:calc(14px + env(safe-area-inset-top))}
.standalone .lockwrap{padding-top:env(safe-area-inset-top)}
.hint button{margin-top:10px;font-weight:800;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);text-decoration:underline}

/* records list still prints from the browser if anyone wants paper */
@media print{ .actionbar,header.app,.crumb{display:none} }

/* The User ID box sits on the dark lock screen, so it has to override the
   ordinary input styling — hence the more specific selector and its position
   at the end of the sheet. */
input.uidbox{
  margin-top:0;margin-bottom:22px;
  background:#22262B;border:2px solid #3A3F45;color:#fff;
  font-size:17px;letter-spacing:.04em;text-align:center;
}
input.uidbox::placeholder{color:#6B7178}
input.uidbox:focus{border-color:var(--hivis);outline:3px solid rgba(255,212,0,.35)}

/* --- project references --------------------------------------------------
   Format: WRM-SC-001-2026. The number is the next one never yet issued, and
   the year is the current one, so a new year starts WRM-SC-014-2027 rather
   than going back to 001. Numbers are never reused, even if a project is
   deleted. Change REF_PREFIX below if the WRM-SC part ever changes.       */
const REF_PREFIX = 'WRM-SC';

function nextProjectRef(){
  const year = new Date().getFullYear();
  const re = new RegExp('^' + REF_PREFIX + '-(\\d+)-(\\d{4})$', 'i');
  let max = state.refseq || 0;
  state.projects.forEach(p => {
    const m = String(p.ref || '').match(re);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return `${REF_PREFIX}-${String(max + 1).padStart(3, '0')}-${year}`;
}
function refInUse(ref, exceptId){
  const r = String(ref || '').trim().toLowerCase();
  return state.projects.some(p => p.id !== exceptId && String(p.ref || '').trim().toLowerCase() === r);
}

async function boot(){
  await initStore();

  state.records  = await DB.allRecords();
  state.projects = await get('projects') || [];
  state.refseq   = await get('refseq')   || 0;
  state.uid      = await get('lastUid')  || '';

  const cur = await get('current');
  state.site = state.projects.find(p => p.id === cur) || null;

  try {
    const res  = await fetch('./icons/icon-180.png');
    const blob = await res.blob();
    PDF.init(await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }));
  } catch(e){ PDF.init(null); }

  // `const` at the top level of a script does not attach to window, so these
  // have to be checked by name rather than as window properties.
  const has = n => { try { return typeof eval(n) !== 'undefined'; } catch(e){ return false; } };
  const missing = [
    !has('PDF')        || typeof PDF.downloadCombined !== 'function' ? 'pdf.js' : null,
    !has('XLS')        ? 'xlsx.js' : null,
    !has('TALKS')      ? 'talks.js' : null,
    !has('ACTIVITIES') ? 'activities.js' : null,
    !has('METHODS')    ? 'methods.js' : null,
    !has('CLOUD')      ? 'cloud.js' : null,
    !has('DB')         ? 'db.js' : null,
    typeof window.supabase === 'undefined' ? 'lib/supabase.js' : null,
  ].filter(Boolean);
  if (missing.length){
    setTimeout(() => toast('Update not finished — close the app fully and reopen'), 800);
    console.warn('Stale or missing scripts:', missing.join(', '));
  }

  const prof = await CLOUD.restore();
  if (prof){
    state.profile = prof;
    state.view = state.site ? 'home' : 'projects';
    render();
    syncNow(true);
    CLOUD.startLive(onLiveChange);
  } else {
    state.view = 'login';
    render();
  }

  window.addEventListener('online', () => { paintNet(); syncNow(); });
  window.addEventListener('offline', paintNet);
  setInterval(() => { if (navigator.onLine && state.profile) syncNow(); }, 60000);
}

/* --- syncing -------------------------------------------------------------
   Push whatever is waiting, then pull everything back down. Signed records
   never change, so pulling can never overwrite good local work.         */
async function syncNow(quiet){
  if (state.syncing || !state.profile) return;
  if (!navigator.onLine){ state.pendingCount = (await DB.pending()).length; paintSync(); return; }
  state.syncing = true; paintSync();
  try {
    // anything completed on this device that has not gone up yet
    const local = (await DB.allRecords()).filter(r => !r.synced);
    for (const r of local){
      const res = await CLOUD.pushRecord(r);
      if (!res.queued){ r.synced = 1; await DB.putRecord(r); }
    }
    await CLOUD.flush();

    const projects = await CLOUD.pullProjects();
    if (projects){
      state.projects = projects;
      const cur = await get('current');
      state.site = projects.find(p => p.id === cur) || state.site;
      if (state.site && !projects.find(p => p.id === state.site.id)) state.site = null;
    }
    const records = await CLOUD.pullRecords();
    if (records) state.records = await DB.allRecords();

    state.lastSync = Date.now();
    await set('lastSync', state.lastSync);
  } catch(e){
    console.warn('sync failed:', e.message || e);
    if (!quiet) toast('Could not sync — will try again');
  }
  state.pendingCount = (await DB.pending()).length;
  state.syncing = false;
  paintSync();
  if (['home','records','projects'].includes(state.view)) render();
}

/* Something changed on the server — pull it in and repaint. This is what
   makes a record appear on someone else's screen as it is signed.      */
let liveTimer = null;
function onLiveChange(){
  clearTimeout(liveTimer);
  liveTimer = setTimeout(async () => {
    const before = state.records.length;
    await syncNow(true);
    const added = state.records.length - before;
    if (added > 0) toast(added === 1 ? 'New record received' : `${added} new records received`);
  }, 600);
}

/* One indicator doing the work of three: are we online, is anything waiting
   to go up, and is it going up right now. */
function paintSync(){
  const l = $('#netlabel'), d = $('#netdot'), b = $('#syncbtn');
  if(!l || !d) return;
  const on = navigator.onLine;
  let label, cls;
  if (state.syncing){ label = 'Syncing…'; cls = 'dot sync'; }
  else if (!on){ label = state.pendingCount ? `Offline · ${state.pendingCount} waiting` : 'Offline'; cls = 'dot off'; }
  else if (state.pendingCount){ label = `${state.pendingCount} waiting`; cls = 'dot warn'; }
  else { label = 'Synced'; cls = 'dot'; }
  l.textContent = label;
  d.className = cls;
  if (b) b.disabled = state.syncing;
}

/* ---- login ------------------------------------------------------------
   User ID above, keypad below. Five digits, then it signs in. Wrong PIN
   five times and it locks for a few minutes — a keypad is easy to guess
   at otherwise.                                                        */
function viewLogin(){
  const locked = state.lockUntil && state.lockUntil > Date.now();
  const wait = locked ? Math.ceil((state.lockUntil - Date.now()) / 1000) : 0;
  return `<div class="tape"></div><div class="lockwrap"><div class="login">
    <div class="mark">${logo("#FFD400","#14171A",16,30)}</div>
    <h2>SiteCheck</h2>
    <p class="by">cloud &middot; by <b>WRM</b></p>
    <p class="strap">${STRAPLINE}</p>

    <label class="uid">User ID</label>
    <input type="text" id="uid" class="uidbox" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false"
           placeholder="e.g. PougherG" value="${esc(state.uid||'')}"
           oninput="state.uid=this.value" ${locked?'disabled':''}>

    <div class="pins">${[0,1,2,3,4].map(i=>`<i class="${state.pin.length>i?'on':''}"></i>`).join('')}</div>
    ${locked ? `<p class="lockmsg">Too many attempts. Try again in ${wait}s.</p>` : ''}
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button ${locked?'disabled':''} onclick="pin('${n}')">${n}</button>`).join('')}
      <button ${locked?'disabled':''} onclick="pin('clear')" style="font-size:12px;letter-spacing:.1em">CLEAR</button>
      <button ${locked?'disabled':''} onclick="pin('0')">0</button>
      <button ${locked?'disabled':''} onclick="pin('del')" style="font-size:18px">&#9003;</button>
    </div>
    <p class="sub" id="loginmsg" style="margin-top:24px;margin-bottom:0">
      ${state.loginMsg ? esc(state.loginMsg) : 'Works with no signal once you have signed in.'}</p>
  </div></div>`;
}

async function pin(k){
  if (state.lockUntil && state.lockUntil > Date.now()) return;
  if(k==='clear') state.pin='';
  else if(k==='del') state.pin = state.pin.slice(0,-1);
  else if(state.pin.length<5) state.pin += k;
  render();
  const box = document.getElementById('uid');
  if (box && document.activeElement !== box && state.uid) box.value = state.uid;
  if(state.pin.length===5) await tryLogin();
}

async function tryLogin(){
  const id = (state.uid||'').trim();
  const p  = state.pin;
  state.pin = '';

  if (!id){ state.loginMsg = 'Enter your User ID first'; render(); return; }
  if (!CLOUD.validId(id)){
    state.loginMsg = 'User IDs use letters, numbers, dots, hyphens or underscores';
    render(); return;
  }

  state.loginMsg = 'Checking…'; render();
  try {
    const prof = await CLOUD.signIn(id, p);
    state.fails = 0;
    state.loginMsg = '';
    await set('lastUid', id);
    await afterLogin(prof);
  } catch(e){
    console.error('sign-in failed:', e);
    const msg = String(e && e.message || e);

    // Only count it as a wrong PIN if that is genuinely what happened.
    // Anything else is a fault worth naming, not a locked-out user.
    const badPin = /invalid login|invalid_credentials|bad_jwt/i.test(msg);

    if (!navigator.onLine){
      state.loginMsg = 'No connection — the first sign-in needs signal';
    } else if (!badPin){
      state.loginMsg = /permission denied|42501/i.test(msg)
        ? 'Signed in, but the database is refusing access. Check the setup script has been run.'
        : msg.slice(0, 90);
    } else {
      state.fails = (state.fails||0) + 1;
      if (state.fails >= 5){
        state.lockUntil = Date.now() + 3*60*1000;
        state.loginMsg = 'Too many attempts — locked for 3 minutes';
        setTimeout(()=>{ state.lockUntil = 0; state.fails = 0; render(); }, 3*60*1000);
      } else {
        state.loginMsg = `Wrong User ID or PIN (${5-state.fails} left)`;
      }
    }
    render();
  }
}

async function afterLogin(prof){
  state.profile = prof;
  state.view = 'projects';
  render();
  await syncNow(true);
  CLOUD.startLive(onLiveChange);
}

async function lock(){
  await CLOUD.signOut();
  state.profile = null; state.pin=''; state.view='login';
  state.uid = await get('lastUid') || '';
  render();
}

}

/* --- search ---------------------------------------------------------------
   Searches form titles, every question inside them, and everything already
   recorded — then tells you which tile the result lives under.            */
function onSearch(v){
  state.q = v;
  const box = document.getElementById('results');
  if (box) box.innerHTML = results();          // swap results only, so the keyboard stays up
  const clr = document.getElementById('qclr');
  if (clr) clr.style.display = v ? 'block' : 'none';
}
function clearSearch(){
  state.q = '';
  const i = document.getElementById('q');
  if (i){ i.value = ''; i.focus(); }
  onSearch('');
}
const WHERE = { checklist:'Forms', ra:'RAMS', hazard:'Report a hazard', incident:'Accident / incident', toolbox:'Toolbox talks' };

function results(){
  const q = (state.q||'').trim().toLowerCase();
  if (!q) return tiles();

  const forms = [];
  FORMS.forEach(f => {
    const head = (f.title+' '+f.desc).toLowerCase().includes(q);
    const qs = [];
    f.sections.forEach(sec => sec.items.forEach(i => {
      if (i.text.toLowerCase().includes(q)) qs.push(i.text);
    }));
    if (head || qs.length) forms.push({f, qs});
  });

  const recs = state.records.filter(r => {
    const hay = (r.title+' '+r.ref+' '+r.by+' '+(r.site&&r.site.name||'')+' '+JSON.stringify(r.answers||{})).toLowerCase();
    return hay.includes(q);
  });

  if (!forms.length && !recs.length) return `<div class="empty">
    <b>Nothing found for &ldquo;${esc(state.q)}&rdquo;</b>
    Try a single word — &ldquo;scaffold&rdquo;, &ldquo;welfare&rdquo;, &ldquo;asbestos&rdquo;.</div>`;

  let out = '';
  if (forms.length){
    out += `<div class="eyebrow">Forms &amp; templates &middot; ${forms.length}</div>`;
    out += forms.map(({f,qs}) => `
      <button class="row hit" onclick="startForm('${f.id}')">
        <span class="code">${f.code}</span>
        <span class="txt"><b>${esc(f.title)}</b>
          <small>${qs.length ? mark(qs[0], q) + (qs.length>1?` &middot; +${qs.length-1} more`:'') : esc(f.desc)}</small></span>
        <span class="where">${WHERE[f.cat]}</span>
      </button>`).join('');
  }
  if (recs.length){
    out += `<div class="eyebrow">Completed records &middot; ${recs.length}</div>`;
    out += recs.slice(0,25).map(r => `
      <button class="row hit" onclick="openRecord('${r.id}')">
        <span class="code">${r.code}</span>
        <span class="txt"><b>${esc(r.title)}</b>
          <small>${esc(r.site&&r.site.name||'')} &middot; ${uk(r.at)}</small></span>
        <span class="where">Records</span>
      </button>`).join('');
  }
  return out;
}
function mark(text, q){
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<em>' + esc(text.slice(i,i+q.length)) + '</em>' + esc(text.slice(i+q.length));
}

      ${tile('History','Every change, who and when',ICONS.history,'var(--ink-soft)',"openAudit()", '')}
      ${CLOUD.isSuper() ? tile('People','Accounts and roles',ICONS.people,'#6B21A8',"openUsers()", '') : ''}
      <button class="tile wide" onclick="go('site')">

          <svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS.site}</svg>

async function startForm(id){
  if (!state.site){ toast('Pick a project first'); go('projects'); return; }
  state.form = FORMS.find(f=>f.id===id);
  state.answers = {};
  state.sig = '';

  // pick up where they left off, if this form was interrupted
  const draft = await DB.get('draft:' + id);
  if (draft && draft.projectId === state.site.id && Object.keys(draft.answers||{}).length){
    if (confirm('You have an unfinished ' + state.form.title + ' on this project. Carry on with it?')){
      state.answers = draft.answers || {};
      state.sig = draft.sig || '';
    } else {
      await DB.del('draft:' + id);
    }
  }
  state.view = 'fill';
  render();
}
function viewFill(){

}

function question(it, n){
  const id = it.id;
  const head = `<span class="num">Q${String(n).padStart(2,'0')}</span>
    <label class="qt" for="i_${id}">${esc(it.text)}</label>
    ${it.guide?`<p class="guide">${esc(it.guide)}</p>`:''}`;
  let ctrl = '';
  switch(it.type){
    case 'check':
      ctrl = `<div class="seg" role="group">
        ${[['pass','Pass'],['fail','Fail'],['na','N/A']].map(([v,l])=>
          `<button type="button" data-v="${v}" aria-pressed="false" onclick="pick('${id}','${v}',this)">${l}</button>`).join('')}
      </div>
      <div class="note"><input type="text" placeholder="Note (optional)" oninput="note('${id}',this.value)"></div>`;
      break;
    case 'textarea':
      ctrl = `<textarea id="i_${id}" oninput="val('${id}',this.value)" placeholder="Type here"></textarea>`; break;
    case 'select':
      ctrl = `<select id="i_${id}" onchange="val('${id}',this.value)"><option value="">Select…</option>
        ${it.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`; break;
    case 'photo':
      ctrl = `<input type="file" accept="image/*" capture="environment" style="margin-top:10px" onchange="addPhoto('${id}',this)">
        <div class="thumbs" id="th_${id}"></div>`; break;
    case 'file':
      ctrl = `<input type="file" id="f_${id}" style="margin-top:10px" onchange="addFile('${id}',this)">
        <div id="fl_${id}"></div>`; break;
    case 'talk':
      return `<div id="talkbox" class="wide">${talkPanel(state.answers.a1 && state.answers.a1.v)}</div>`;
    case 'risk':
      ctrl = riskCtrl(id); break;
    case 'repeat':
      ctrl = `<div id="rp_${id}"></div>
        <button class="btn ghost" style="margin-top:12px;padding:12px" onclick="addRow('${id}')">+ Add ${(it.rowLabel||'item').toLowerCase()}</button>`; break;
    case 'activity':
      return `<div class="q talkq" id="actbox">${activityPanel()}</div>`;
    case 'method':
      return `<div class="q talkq" id="methbox">${methodPanel()}</div>`;
    default:
      ctrl = `<input type="${it.type==='tel'?'tel':it.type}" id="i_${id}" oninput="val('${id}',this.value)">`;
  }
  const wide = ['repeat','talk'].includes(it.type) ? ' wide' : '';
  return `<div class="q${wide}" data-q="${id}">${head}${ctrl}</div>`;
}
function riskCtrl(id, path, val){
  const p = path||id;
  const v = val || {l:1,s:1,score:1};
  const b = riskBand(v.score||1);
  const o = sel => Array.from({length:5},(_,i)=>
    `<option value="${i+1}"${(+sel===i+1)?' selected':''}>${i+1}</option>`).join('');
  return `<div class="risk">
    <div><label>Likelihood</label><select onchange="rate('${p}','l',this.value)">${o(v.l)}</select></div>
    <div><label>Severity</label><select onchange="rate('${p}','s',this.value)">${o(v.s)}</select></div>
    <div class="score ${b.l==='MEDIUM'?'med':''}" id="sc_${p.replace(/\./g,'_')}" style="background:${b.c}">${v.score||1}<small>${b.l}</small></div>
  </div>`;
}

/* answer handlers */
function pick(id,v,btn){
  state.answers[id] = Object.assign({}, state.answers[id], {v});
  btn.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===btn?'true':'false'));
  progress();
}
function note(id,v){ state.answers[id] = Object.assign({}, state.answers[id], {note:v}); }
function val(id,v){
  state.answers[id] = {v};
  const box = document.getElementById('talkbox');
  if (box && id === 'a1') box.innerHTML = talkPanel(v);
  progress();
}

/* --- standard activity library -------------------------------------------
   Pick an activity and its standard rows are added to the assessment table,
   ready to edit or delete. 'General activities' loads the site-wide set.  */
function activityPanel(){
  const keys = Object.keys(ACTIVITIES);
  return `<span class="num">STANDARD ACTIVITIES</span>
    <label class="qt" for="actsel">Load a standard activity</label>
    <p class="guide">Adds the usual hazards, effects, persons affected and control measures
    for that activity. Edit, delete or add rows afterwards — nothing is fixed.</p>
    <select id="actsel">
      <option value="">Choose an activity…</option>
      <option value="__general">General activities — the standard site-wide set (${GENERAL_SET.reduce((n,k)=>n+(ACTIVITIES[k]||[]).length,0)} rows)</option>
      ${keys.map(k=>`<option value="${esc(k)}">${esc(k)} (${ACTIVITIES[k].length})</option>`).join('')}
    </select>
    <button class="btn ghost" style="padding:12px;margin-top:10px" onclick="loadActivity()">Add to the assessment</button>`;
}
function loadActivity(){
  const sel = document.getElementById('actsel');
  const key = sel && sel.value;
  if (!key){ toast('Choose an activity first'); return; }

  const keys = key === '__general' ? GENERAL_SET : [key];
  const rows = keys.reduce((acc, k) => acc.concat(ACTIVITIES[k] || []), []);
  if (!rows.length){ toast('Nothing to add'); return; }

  setField('a1', key === '__general' ? 'General site activities' : key.split(' — ')[0]);
  state.answers.a4 = state.answers.a4 || {rows:[]};
  // deep copy, so editing a row never changes the library
  rows.forEach(r => state.answers.a4.rows.push(JSON.parse(JSON.stringify(r))));
  renderRows('a4');
  progress();
  sel.value = '';
  toast(`${rows.length} row${rows.length>1?'s':''} added`);
  const box = document.getElementById('rp_a4');
  if (box) box.scrollIntoView({behavior:'smooth', block:'start'});
}

/* --- standard method statement outlines ----------------------------------
   These give you the usual sequence, plant, PPE and emergency arrangements
   for a common task. They are a skeleton — every one needs the real site
   detail adding before it means anything.                                */
function methodPanel(){
  const keys = Object.keys(METHODS);
  return `<span class="num">STANDARD OUTLINES</span>
    <label class="qt" for="methsel">Load a standard method statement</label>
    <p class="guide">Fills the scope, sequence of operations, plant list, PPE and emergency
    arrangements. <b>Everything then needs editing to the actual job</b> — the outlines contain
    placeholders like [AREA] and [WEIGHT] that must be replaced.</p>
    <select id="methsel">
      <option value="">Choose an outline…</option>
      ${keys.map(k=>`<option value="${esc(k)}">${esc(k)} (${METHODS[k].steps.length} steps)</option>`).join('')}
    </select>
    <button class="btn ghost" style="padding:12px;margin-top:10px" onclick="loadMethod()">Load into this method statement</button>`;
}
function setField(id, v, appendIfFilled){
  const cur = (state.answers[id] || {}).v || '';
  const val = (cur && appendIfFilled) ? (cur + '\n\n' + v) : (cur ? cur : v);
  state.answers[id] = { v: val };
  const el = document.getElementById('i_' + id);
  if (el) el.value = val;
}
function loadMethod(){
  const sel = document.getElementById('methsel');
  const key = sel && sel.value;
  if (!key){ toast('Choose an outline first'); return; }
  const m = METHODS[key];
  if (!m) return;

  // name the job after the outline, so the record identifies itself
  setField('a1', key.split(' — ')[0]);
  setField('b1', m.scope);
  setField('g8', m.ppe);
  setField('i1', m.emergency);

  state.answers.c1 = state.answers.c1 || {rows:[]};
  m.steps.forEach(r => state.answers.c1.rows.push(JSON.parse(JSON.stringify(r))));
  renderRows('c1');

  state.answers.e1 = state.answers.e1 || {rows:[]};
  m.plant.forEach(r => state.answers.e1.rows.push(JSON.parse(JSON.stringify(r))));
  renderRows('e1');

  progress();
  sel.value = '';
  toast(`${m.steps.length} steps loaded — now edit to the real job`);
  const box = document.getElementById('rp_c1');
  if (box) box.scrollIntoView({behavior:'smooth', block:'start'});
}

/* --- toolbox talk library ------------------------------------------------
   Pick a topic and the prepared talk appears. Use it as written, drop the
   points into the record, print it with an attendance grid, or ignore it
   entirely and type your own.                                            */
function talkPanel(topic){
  const t = topic && TALKS[topic];
  if (!t) return `<div class="q talkq"><span class="num">TALK NOTES</span>
    <p class="guide" style="border:0;padding:0;margin:0">Choose a topic above and a prepared
    talk will appear here — what to say, questions to ask, and a printable sheet with an
    attendance grid. Or write your own below.</p></div>`;
  return `<div class="q talkq">
    <span class="num">PREPARED TALK</span>
    <label class="qt">${esc(topic)}</label>
    <p class="why">${esc(t.why)}</p>
    <div class="tgrid">
      <div class="tcol">
        <div class="tsec">Points to cover</div>
        <ol class="tlist">${t.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
      </div>
      <div class="ddcol do"><h5>Do</h5><ul>${t.do.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
      <div class="ddcol dont"><h5>Don't</h5><ul>${t.dont.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
    </div>
    <div class="tsec">Ask the group</div>
    <ol class="tlist ask">${t.ask.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
    <p class="tref">${esc(t.ref)}</p>
    <button class="btn ghost" style="padding:12px" onclick="useTalk()">Use these points in the record</button>
    <button class="btn ghost" style="padding:12px" onclick="printTalk()">Download talk sheet (PDF)</button>
  </div>`;
}
function useTalk(){
  const topic = state.answers.a1 && state.answers.a1.v;
  const t = topic && TALKS[topic];
  if (!t){ toast('Choose a topic first'); return; }
  const text = t.points.map((p,i)=>`${i+1}. ${p}`).join('\n')
    + '\n\nDO:\n' + t.do.map(p=>'- '+p).join('\n')
    + '\n\nDO NOT:\n' + t.dont.map(p=>'- '+p).join('\n');
  const box = document.getElementById('i_b1');
  if (box){ box.value = text; state.answers.b1 = {v:text}; box.focus(); progress(); toast('Points added — edit as you like'); }
}
function printTalk(){
  const topic = state.answers.a1 && state.answers.a1.v;
  const t = topic && TALKS[topic];
  if (!t){ toast('Choose a topic first'); return; }
  try { PDF.downloadTalk(topic, t, state.site, (state.site||{}).user || ''); toast('Talk sheet downloaded'); }
  catch(e){ console.error(e); toast('Could not build the talk sheet'); }
}
function rate(path,k,v){
  const cur = getPath(path) || {l:1,s:1};
  cur[k] = +v; cur.score = cur.l*cur.s;
  setPath(path, cur);
  const el = document.getElementById('sc_'+path.replace(/\./g,'_'));
  if(el){ const b = riskBand(cur.score);
    el.style.background = b.c;
    el.className = 'score' + (b.l==='MEDIUM' ? ' med' : '');
    el.innerHTML = cur.score+'<small>'+b.l+'</small>'; }
  progress();
}
function getPath(p){
  const [id,i,col] = p.split('.');
  if(i===undefined) return state.answers[id]?.v;
  return state.answers[id]?.rows?.[+i]?.[col];
}
function setPath(p,v){
  const [id,i,col] = p.split('.');
  if(i===undefined){ state.answers[id] = {v}; return; }
  state.answers[id] = state.answers[id] || {rows:[]};
  state.answers[id].rows[+i] = state.answers[id].rows[+i] || {};
  state.answers[id].rows[+i][col] = v;
}
/* --- repeating tables ------------------------------------------------------
   Rows live in state.answers[id].rows. The whole block is re-rendered from
   that array, so rows can be added by hand or loaded from the activity
   library and still show their values.                                    */
function addRow(id, values){
  state.answers[id] = state.answers[id] || {rows:[]};
  state.answers[id].rows.push(values || {});
  renderRows(id);
  progress();
}
function removeRow(id, i){
  state.answers[id].rows.splice(i, 1);
  renderRows(id);
  progress();
}
function renderRows(id){
  const it = findItem(id);
  const wrap = document.getElementById('rp_' + id);
  if (!wrap) return;
  const rows = (state.answers[id] || {}).rows || [];
  wrap.innerHTML = rows.map((row, i) => rowHtml(it, id, i, row)).join('');
}
function rowHtml(it, id, i, row){
  const lbl = it.rowLabel || 'Item';
  const lab = t => `<label style="font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)">${esc(t)}</label>`;
  const body = it.columns.map(c => {
    const p = `${id}.${i}.${c.id}`;
    const v = row[c.id];
    const inner =
      c.type === 'risk'     ? riskCtrl(id, p, v)
    : c.type === 'sign'     ? signBox(p)
    : c.type === 'textarea' ? `<textarea oninput="setPath('${p}',this.value)">${esc(v||'')}</textarea>`
    :                         `<input type="text" value="${esc(v||'')}" oninput="setPath('${p}',this.value)">`;
    return `<div class="fld fld-${c.type}">${lab(c.label)}${inner}</div>`;
  }).join('');
  return `<div class="rep ${it.layout==='ra'?'ra':''}"><h4>${esc(lbl)} ${i+1}</h4>
    <div class="fldgrid">${body}</div>
    <button class="del" onclick="removeRow('${id}',${i})">Remove this ${esc(lbl.toLowerCase())}</button></div>`;
}

function findItem(id){

/* --- attaching a document ------------------------------------------------
   Held inside the record on this device. Images are embedded in the PDF;
   anything else travels with the record and can be downloaded from it.   */
const FILE_MAX = 3 * 1024 * 1024;   // 3MB — device storage is limited

async function addFile(id, input){
  const file = input.files[0]; if (!file) return;
  if (file.size > FILE_MAX){
    toast('File too large — 3MB maximum');
    input.value = ''; return;
  }
  try {
    const data = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new Error('read failed'));
      fr.readAsDataURL(file);
    });
    state.answers[id] = { file: { name:file.name, type:file.type||'file', size:file.size, data } };
    drawFile(id);
    toast('File attached');
  } catch(e){ toast('Could not read that file'); }
  input.value = '';
  progress();
}
function drawFile(id){
  const box = document.getElementById('fl_' + id); if (!box) return;
  const f = (state.answers[id] || {}).file;
  box.innerHTML = f ? `<div class="attach">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14 3v5h5"/><path d="M6 3h9l5 5v13H6z"/></svg>
      <span class="txt"><b>${esc(f.name)}</b><small>${fileSize(f.size)}</small></span>
      <button onclick="rmFile('${id}')" aria-label="Remove">&times;</button>
    </div>` : '';
}
function rmFile(id){ delete state.answers[id]; drawFile(id); progress(); }
const fileSize = n => n < 1024 ? n + ' B'
  : n < 1048576 ? (n/1024).toFixed(0) + ' KB' : (n/1048576).toFixed(1) + ' MB';

function downloadAttachment(recId, itemId){
  const r = state.records.find(x => x.id === recId);
  const f = ((r.answers||{})[itemId] || {}).file; if (!f) return;
  const a = document.createElement('a');
  a.href = f.data; a.download = f.name; a.click();
}

async function addPhoto(id, input){
  const file = input.files[0]; if(!file) return;
  const data = await shrink(file);
  state.answers[id] = state.answers[id] || {photos:[]};
  state.answers[id].photos = state.answers[id].photos || [];
  state.answers[id].photos.push(data);
  drawThumbs(id); input.value=''; progress();
}
function drawThumbs(id){
  const box = document.getElementById('th_'+id);
  const ps = state.answers[id]?.photos || [];
  box.innerHTML = ps.map((p,i)=>`<figure><img src="${p}" alt=""><button onclick="rmPhoto('${id}',${i})" aria-label="Remove photo">&times;</button></figure>`).join('');
}
function rmPhoto(id,i){ state.answers[id].photos.splice(i,1); drawThumbs(id); }
function shrink(file){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900, sc = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement('canvas');
        c.width = img.width*sc; c.height = img.height*sc;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.6));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
/* Autosave. A form half-filled on a roof, then interrupted, has to still be
   there afterwards. Saved a second after you stop typing.               */
let draftTimer = null;
function saveDraft(){
  if (!state.form) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(async () => {
    try {
      await DB.set('draft:' + state.form.id, {
        answers: state.answers, sig: state.sig,
        projectId: (state.site||{}).id, at: Date.now(),
      });
      const el = document.getElementById('draftnote');
      if (el) el.textContent = 'Saved on this device';
    } catch(e){ console.warn('draft save failed', e); }
  }, 900);
}

function progress(){
  saveDraft();
  const total = countItems(state.form);
  const done = Object.keys(state.answers).filter(k=>{
    const a = state.answers[k];
    return a && (a.v!==undefined && a.v!=='' || a.rows?.length || a.photos?.length || a.file);
  }).length;
  const p = $('#prog'); if(p) p.textContent = `${done} of ${total} answered`;
}

/* --- signatures -----------------------------------------------------------
   Signing happens in a pop-up rather than inline. An inline canvas swallows
   the scroll gesture, so a finger dragged over it to scroll the page leaves
   a stray mark. Tapping the box opens a full-screen pad instead.         */
const safeKey = k => String(k).replace(/\./g, '_');

function getSign(key){ return key === 'main' ? (state.sig || '') : (getPath(key) || ''); }
function setSign(key, v){ if (key === 'main') state.sig = v; else setPath(key, v); }

function signBox(key){
  const data = getSign(key);
  return `<div class="signwrap" id="sw_${safeKey(key)}">
    <button type="button" class="signbox ${data ? 'signed' : ''}" onclick="openSign('${key}')">
      ${data ? `<img src="${data}" alt="Signature">`
             : `<span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 19c3 0 4-10 7-10s3 7 5 7 2-4 4-4 2 2 2 2"/></svg> Tap to sign</span>`}
    </button>
    ${data ? `<button type="button" class="signclear" onclick="clearSign('${key}')">Clear signature</button>` : ''}
  </div>`;
}
function refreshSign(key){
  const el = document.getElementById('sw_' + safeKey(key));
  if (el) el.outerHTML = signBox(key);
}
function clearSign(key){ setSign(key, ''); refreshSign(key); progress(); }

let padCtx = null, padDrawn = false, padKey = null;

function openSign(key){
  padKey = key; padDrawn = false;
  const el = document.createElement('div');
  el.className = 'signmodal'; el.id = 'signmodal';
  el.innerHTML = `<div class="signpanel" role="dialog" aria-modal="true" aria-label="Signature">
      <div class="signhead"><b>Sign below</b><span>Use your finger or a stylus</span></div>
      <canvas id="padbig"></canvas>
      <div class="signfoot">
        <button type="button" class="btn ghost" onclick="closeSign()">Cancel</button>
        <button type="button" class="btn ghost" onclick="wipePad()">Clear</button>
        <button type="button" class="btn go" onclick="doneSign()">Done</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';

  const c = document.getElementById('padbig');
  const dpr = window.devicePixelRatio || 1;
  c.width = c.offsetWidth * dpr; c.height = c.offsetHeight * dpr;
  padCtx = c.getContext('2d');
  padCtx.scale(dpr, dpr);
  padCtx.lineWidth = 2.6; padCtx.lineCap = 'round'; padCtx.lineJoin = 'round';
  padCtx.strokeStyle = '#14171A';

  // start from the existing signature, so opening it again does not wipe it
  const existing = getSign(key);
  if (existing){
    const img = new Image();
    img.onload = () => padCtx.drawImage(img, 0, 0, c.offsetWidth, c.offsetHeight);
    img.src = existing;
    padDrawn = true;
  }

  let drawing = false;
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener('pointerdown', e => {
    drawing = true; padDrawn = true; c.setPointerCapture(e.pointerId);
    padCtx.beginPath(); padCtx.moveTo(...pos(e)); e.preventDefault();
  });
  c.addEventListener('pointermove', e => {
    if (!drawing) return;
    padCtx.lineTo(...pos(e)); padCtx.stroke(); e.preventDefault();
  });
  c.addEventListener('pointerup', () => { drawing = false; });
  c.addEventListener('pointerleave', () => { drawing = false; });
}
function wipePad(){
  const c = document.getElementById('padbig');
  if (padCtx && c){ padCtx.clearRect(0, 0, c.width, c.height); padDrawn = false; }
}
function closeSign(){
  const el = document.getElementById('signmodal');
  if (el) el.remove();
  document.body.style.overflow = '';
  padCtx = null; padKey = null;
}
function doneSign(){
  const c = document.getElementById('padbig');
  if (!padDrawn){ toast('Nothing signed yet'); return; }
  const key = padKey;
  setSign(key, c.toDataURL('image/png'));
  closeSign();
  refreshSign(key);
  progress();
}

/* ---- submit ---- */
/* A record names itself from one of its own answers, so a list of six method
   statements reads as the six jobs rather than six identical titles. */
function recordTitle(form, answers){
  if (!form.titleFrom) return form.title;
  const v = (answers[form.titleFrom] || {}).v;
  const label = (typeof v === 'string' ? v : '').trim();
  if (!label) return form.title;
  const short = label.length > 60 ? label.slice(0, 57).trim() + '…' : label;
  return `${form.title} (${short})`;
}

async function submitForm(){
  const by = $('#signedBy').value.trim();
  if(!by){ toast('Enter your name before completing'); $('#signedBy').focus(); return; }
  if(!state.sig){ toast('Tap the signature box to sign'); return; }

  const f = state.form;
  const at = new Date().toISOString();
  const seq = String(state.records.filter(r=>r.formId===f.id).length + 1).padStart(3,'0');
  const ref = `WRM-${f.code}-${at.slice(0,10).replace(/-/g,'')}-${seq}`;
  let fails = 0;
  f.sections.forEach(s=>s.items.forEach(i=>{ if(state.answers[i.id]?.v==='fail') fails++; }));

  const rec = {
    id: crypto.randomUUID(), ref, formId:f.id, code:f.code, title: recordTitle(f, state.answers),
    projectId: (state.site||{}).id || null,
    at, by, fails,
    site: Object.assign({}, state.site),
    answers: JSON.parse(JSON.stringify(state.answers)),
    sig: state.sig,
    createdBy: (state.profile||{}).id,
    synced: 0,
  };

  // on the device first — this must not depend on a connection
  await DB.putRecord(rec);
  state.records.unshift(rec);
  await DB.del('draft:' + f.id);

  state.record = rec;
  state.view = 'record';
  render();

  const res = await CLOUD.pushRecord(rec);
  if (res.queued){
    state.pendingCount = (await DB.pending()).length;
    paintSync();
    toast('Saved on this device — will sync when back online');
  } else {
    rec.synced = 1;
    await DB.putRecord(rec);
    paintSync();
    toast('Saved to ' + ((state.site||{}).name || 'this project'));
    fileRecordPDF(rec);          // files the signed PDF against the project
  }
}

async function saveUser(existingId){
  const btn = document.getElementById('u_save');
  const val = id => (document.getElementById(id) || {}).value || '';

  const name   = val('u_name').trim();
  const pin    = val('u_pin').trim();

  const role   = val('u_role');

  if (!CLOUD.validId(userId)){ toast('User ID: 3+ letters, numbers, dots, hyphens or underscores'); return; }
  if (!name){ toast('Enter their full name'); return; }
  if (!existingId && !/^\d{5}$/.test(pin)){ toast('The PIN must be exactly 5 digits'); return; }
  if (existingId && pin && !/^\d{5}$/.test(pin)){ toast('The PIN must be exactly 5 digits'); return; }

  if (btn){ btn.disabled = true; btn.textContent = 'Working…'; }
  try {
    if (!existingId){
      await CLOUD.createUser(userId, pin, name, email, role);
      closeSheet();
      openSheet('Account created', `
        <p class="sheetnote">Give these to <b>${esc(name)}</b>. The PIN is not shown again.</p>

async function openShare(){

    const meId = (state.profile||{}).id;
    const shared = new Set(shares.map(x => x.user_id));
    const others = users.filter(u => u.id !== meId && u.id !== state.site.ownerId && u.active);
    openSheet('Share ' + state.site.name, `
      <p class="sheetnote">Anyone ticked can see this project and everything recorded on it.
        Accident reports stay private to whoever raised them.</p>
      ${others.length ? others.map(u => `
        <label class="pick">

          <span class="txt"><b>${esc(u.user_id)}</b><small>${esc(u.full_name||'')} · ${esc(u.role)}</small></span>
        </label>`).join('') : '<div class="empty"><b>Nobody else to share with yet</b></div>'}
      <button class="btn go" onclick="saveShares()">Save sharing</button>`);
  } catch(e){ toast('Could not load the list'); }
}

async function saveShares(){
  const boxes = [...document.querySelectorAll('.sharebox')];
  const want = new Set(boxes.filter(b => b.checked).map(b => b.value));
  try {
    const have = new Set((await CLOUD.listShares(state.site.id)).map(x => x.user_id));
    for (const id of want) if (!have.has(id)) await CLOUD.share(state.site.id, id);
    for (const id of have) if (!want.has(id)) await CLOUD.unshare(state.site.id, id);
    closeSheet();
    toast(want.size ? `Shared with ${want.size}` : 'Sharing removed');
  } catch(e){ console.error(e); toast('Could not save sharing'); }
}

async function uploadDoc(){

  if (!f){ toast('Choose a file first'); return; }
  if (f.size > 15 * 1024 * 1024){ toast('That file is over 15MB'); return; }

    state.docs = await CLOUD.listDocuments(state.site.id);
    render(); toast('Uploaded');

/* File the signed PDF against the project, so the office has it without
   anyone emailing anything. */
async function fileRecordPDF(rec){
  if (!navigator.onLine) return;
  const form = FORMS.find(f => f.id === rec.formId);
  const folder = form.cat === 'toolbox' ? 'Toolbox talks'
               : form.cat === 'ra' ? 'RAMS'
               : form.cat === 'incident' ? 'Accidents' : 'Inspections';
  try {
    const blob = PDF.blob(rec, form);
    const file = new File([blob], PDF.filename(rec), { type:'application/pdf' });
    await CLOUD.uploadDocument(rec.projectId, folder, file, rec.id);
  } catch(e){ console.warn('could not file the PDF:', e.message || e); }
}

const D = v => v ? new Date(v) : '';
const projName = r => (r.site && r.site.name) || '';
function ansOf(r, id){ const a = (r.answers||{})[id]; return a ? a.v : ''; }
function ansText(r, id){ const v = ansOf(r, id); return (v && typeof v === 'object') ? '' : (v || ''); }

function sheetProjects(){
  const rows = [['Project','Reference','Address','Client','Records','Items failed','Last activity']];
  state.projects.forEach(pj => {
    const rs = state.records.filter(r => r.projectId === pj.id);
    rows.push([pj.name, pj.ref||'', pj.address||'', pj.client||'', rs.length,
      rs.reduce((t,r)=>t+(r.fails||0),0),
      rs.length ? D(rs[0].at) : '']);
  });
  return { name:'Projects', widths:[30,16,40,24,10,12,18], rows };
}
/* how an answer of any type reads in a spreadsheet cell */
function answerText(item, a){
  if (!a) return '';
  if (item.type === 'check')
    return { pass:'Pass', fail:'FAIL', na:'N/A' }[a.v] || 'Not answered';
  if (item.type === 'risk'){
    const v = a.v || {};
    return v.score ? `${riskBand(v.score).l} ${v.score} (L${v.l} x S${v.s})` : '';
  }
  if (item.type === 'photo') return (a.photos || []).length ? `${a.photos.length} photo(s)` : '';
  if (item.type === 'file') return a.file ? a.file.name : '';
  if (item.type === 'talk') return '';
  if (item.type === 'repeat') return `${((a.rows)||[]).length} entries`;
  return a.v == null ? '' : String(a.v);
}

function sheetRecords(){
  const rows = [['Date','Project','Form','Code','Reference','Completed by',
                 'Items','Passed','Failed','N/A','Not answered','Failed items and notes']];
  state.records.forEach(r => {
    const f = FORMS.find(x => x.id === r.formId); if (!f) return;
    let pass=0, fail=0, na=0, blank=0, total=0;
    const detail = [];
    f.sections.forEach(sec => sec.items.forEach(i => {
      total++;
      if (i.type !== 'check') return;
      const a = (r.answers||{})[i.id] || {};
      if (a.v === 'pass') pass++;
      else if (a.v === 'na') na++;
      else if (a.v === 'fail'){
        fail++;
        detail.push(i.text + (a.note ? ' — ' + a.note : ''));
      } else blank++;
    }));
    rows.push([D(r.at), projName(r), r.title, r.code, r.ref, r.by,
      total, pass, fail, na, blank, detail.join('\n')]);
  });
  return { name:'All records', widths:[18,26,34,8,24,20,8,9,8,8,13,70], rows };
}

/* one row per question, for every record — the fullest view of the data */
function sheetAnswers(){
  const rows = [['Date','Project','Form','Code','Reference','Section','Question','Answer','Note','Completed by']];
  state.records.forEach(r => {
    const f = FORMS.find(x => x.id === r.formId); if (!f) return;
    f.sections.forEach(sec => sec.items.forEach(i => {
      const a = (r.answers||{})[i.id] || {};
      if (i.type === 'repeat'){
        const label = i.rowLabel || 'Item';
        ((a.rows)||[]).forEach((row, n) => {
          const txt = i.columns.map(c => {
            if (c.type === 'risk'){
              const v = row[c.id] || {};
              return v.score ? `${c.label}: ${riskBand(v.score).l} ${v.score}` : '';
            }
            return row[c.id] ? `${c.label}: ${row[c.id]}` : '';
          }).filter(Boolean).join(' | ');
          rows.push([D(r.at), projName(r), r.title, r.code, r.ref, sec.title,
            `${label} ${n+1}`, txt, '', r.by]);
        });
        return;
      }
      rows.push([D(r.at), projName(r), r.title, r.code, r.ref, sec.title,
        i.text, answerText(i, a), (a.note || ''), r.by]);
    }));
  });
  return { name:'Every answer', widths:[18,24,30,8,24,26,56,30,44,18], rows };
}

function answerHtml(i,a){
  if(i.type==='check'){
    const m = {pass:['go','Pass'],fail:['stop','Fail'],na:['grey','N/A']}[a.v] || ['grey','Not answered'];
    return `<div style="margin-top:8px"><span class="pill ${m[0]}">${m[1]}</span>${a.note?`<p class="guide" style="margin-top:8px">${esc(a.note)}</p>`:''}</div>`;
  }
  if(i.type==='file'){
    const f = a.file;
    return f ? `<div class="attach" style="margin-top:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M14 3v5h5"/><path d="M6 3h9l5 5v13H6z"/></svg>
        <span class="txt"><b>${esc(f.name)}</b><small>${fileSize(f.size)}</small></span>
        <button onclick="downloadAttachment('${state.record.id}','${i.id}')" aria-label="Download">&darr;</button>
      </div>` : '<small style="color:var(--ink-soft)">No file attached</small>';
  }
  if(i.type==='photo') return `<div class="thumbs">${(a.photos||[]).map(p=>`<figure><img src="${p}" alt=""></figure>`).join('') || '<small style="color:var(--ink-soft)">No photos</small>'}</div>`;
  if(i.type==='risk'){
    const v = a.v || {l:1,s:1,score:1}; const b = riskBand(v.score||1);
    return `<div style="margin-top:8px"><span class="pill" style="background:${b.c}">${b.l} · ${v.score||1} (L${v.l}×S${v.s})</span></div>`;
  }
  if(i.type==='repeat'){
    return (a.rows||[]).map((row,n)=>`<div class="rep"><h4>${esc(i.rowLabel||'Item')} ${n+1}</h4>
      ${i.columns.map(c=>{
        if(c.type==='risk'){ const v=row[c.id]||{}; const b=riskBand(v.score||1);
          return `<p style="margin:4px 0"><b>${esc(c.label)}:</b> <span class="pill" style="background:${b.c}">${b.l} · ${v.score||1}</span></p>`; }
        if(c.type==='sign'){ return row[c.id]
          ? `<p style="margin:4px 0"><b>${esc(c.label)}:</b></p><img src="${row[c.id]}" alt="Signature" style="height:46px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:2px">`
          : `<p style="margin:4px 0"><b>${esc(c.label)}:</b> Not signed</p>`; }
        return `<p style="margin:4px 0"><b>${esc(c.label)}:</b> ${esc(row[c.id]||'—')}</p>`;
      }).join('')}</div>`).join('') || '<small style="color:var(--ink-soft)">None recorded</small>';
  }
  return `<p style="margin:8px 0 0">${esc(a.v||'—')}</p>`;
}

async function deleteRecord(){
  if(!confirm('Delete this record? It cannot be recovered.')) return;
  state.records = state.records.filter(r=>r.id!==state.record.id);
  await DB.putRecords(state.records);
  go('records'); toast('Record deleted');
}

/* ---- PDF ------------------------------------------------------------------
   A real PDF file, built on the device by pdf.js. No print dialogue, no
   network. Risk assessments come out landscape so the hazard table fits.   */
function makePDF(){
  const r = state.record, f = FORMS.find(x => x.id === r.formId);
  try {
    PDF.download(r, f);
    toast('PDF saved to your downloads');
  } catch(e){
    console.error(e);
    toast('Could not build the PDF');
  }
}

/* --- combined risk assessment + method statement -------------------------
   Issued as one document, the way a RAMS normally is. Offered from either
   half of the pair; the counterpart is picked from the same project.     */
const PAIR = { ra01:'ms01', ms01:'ra01' };
const PAIR_NAME = { ra01:'method statement', ms01:'risk assessment' };

function counterparts(rec){
  const want = PAIR[rec.formId];
  return state.records.filter(r => r.formId === want && r.projectId === rec.projectId);
}
/* Always ask which counterpart to combine with — with several risk
   assessments and several method statements on a project, guessing would
   quietly produce the wrong document. More than one can be selected.   */
function combinedRAMS(){
  const rec = state.record;
  const list = counterparts(rec).slice().sort((a,b) => new Date(b.at) - new Date(a.at));
  if (!list.length){
    toast(`No ${PAIR_NAME[rec.formId]} recorded for this project yet`);
    return;
  }
  const thisTask = rec.title;
  openSheet(`Combine with which ${PAIR_NAME[rec.formId]}?`,
    `<p class="sheetnote">Combining <b>${esc(thisTask)}</b> (${esc(rec.ref)}).
       Tick one or more — they will be added in the order shown, risk assessment first.</p>
     ${list.map((r,i) => `
       <label class="pick">
         <input type="checkbox" class="pickbox" value="${r.id}"${list.length===1?' checked':''}>
         <span class="txt"><b>${esc(r.title)}</b>
           <small>${esc(r.ref)} &middot; ${uk(r.at)} &middot; ${esc(r.by)}</small></span>
       </label>`).join('')}
     <button class="btn go" onclick="combineSelected()">Download combined RAMS</button>`);
}

function combineSelected(){
  const rec = state.record;
  const ids = [...document.querySelectorAll('.pickbox:checked')].map(b => b.value);
  if (!ids.length){ toast('Tick at least one'); return; }

  const chosen = ids.map(id => state.records.find(r => r.id === id)).filter(Boolean);
  // risk assessments always lead, method statements follow
  const ras = rec.formId === 'ra01' ? [rec, ...chosen.filter(r => r.formId === 'ra01')]
                                    : chosen.filter(r => r.formId === 'ra01');
  const mss = rec.formId === 'ms01' ? [...chosen.filter(r => r.formId === 'ms01'), rec]
                                    : chosen.filter(r => r.formId === 'ms01');
  const ordered = [...ras, ...mss];

  if (typeof PDF.downloadCombined !== 'function'){
    toast('Close the app fully and reopen to finish updating');
    closeSheet(); return;
  }
  const parts = ordered.map(r => ({ rec:r, form: FORMS.find(f => f.id === r.formId) }));
  const label = `RAMS · ${(rec.site && rec.site.ref) || (rec.site && rec.site.name) || ''}`.trim();
  const task = ansOf(rec,'a1') || rec.title;
  const name = `${(rec.site&&rec.site.ref)||'RAMS'} RAMS - ${task}`
                 .replace(/[^\w\-. ]+/g,'').slice(0,90) + '.pdf';
  try {
    PDF.downloadCombined(parts, label, name);
    toast(`${ordered.length} documents combined`);
  } catch(e){ console.error(e); toast('Could not build the combined PDF — see console'); }
  closeSheet();
}

/* --- a simple bottom sheet, for choosing between records ---------------- */
function openSheet(title, inner){
  const el = document.createElement('div');
  el.className = 'sheetwrap'; el.id = 'sheetwrap';
  el.innerHTML = `<div class="sheetbg" onclick="closeSheet()"></div>
    <div class="sheetbox" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3>${inner}
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
    </div>`;
  document.body.appendChild(el);
}
function closeSheet(){ const el = document.getElementById('sheetwrap'); if (el) el.remove(); }

/* Share sheet on a phone: attaches the actual PDF to an email, WhatsApp,
   AirDrop and so on. Falls back to downloading it on a laptop. */
async function sharePDF(){
  const r = state.record, f = FORMS.find(x => x.id === r.formId);
  try {
    const file = new File([PDF.blob(r, f)], PDF.filename(r), { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: r.title, text: `${r.title} — ${r.ref}` });
      return;
    }
    PDF.download(r, f);
    const body = [r.title, r.ref, '',
      'Project: ' + ((r.site && r.site.name) || '—'),
      'Completed: ' + uk(r.at) + ' by ' + r.by,
      'Items failed: ' + r.fails, '',
      'The PDF has been downloaded — please attach it to this email.'].join('\n');
    location.href = `mailto:?subject=${encodeURIComponent(r.title + ' — ' + r.ref)}&body=${encodeURIComponent(body)}`;
  } catch(e){
    if (e && e.name === 'AbortError') return;      // user dismissed the share sheet
    console.error(e); toast('Could not share the PDF');
  }
}

async function exportAll(){
  const blob = new Blob([JSON.stringify({exported:new Date().toISOString(), site:state.site, records:state.records}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `wrm-sitecheck-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('Backup file downloaded');
}

/* ---- site details ---- */
function viewSite(){
  const isNew = state.editing === 'new';
  const s = isNew ? { ref: nextProjectRef() } : (state.site || {});
  const fld = (k,l,ph) => `<div class="q"><label class="qt" for="s_${k}">${l}</label>
    <input type="text" id="s_${k}" value="${esc(s[k]||'')}" placeholder="${ph}"></div>`;
  const back = isNew ? "go('projects')" : "go('home')";
  return crumb(isNew?'Projects':'Home', back, isNew?'New project':'Site details') + `<main>
    <div class="banner"><b>${isNew?'New project':'Set once, used everywhere'}</b>These details print at the top of every form completed on this project.</div>
    <div class="eyebrow">Project</div>
    ${fld('name','Project / site name','e.g. Elliott Street redevelopment')}
    <div class="q"><label class="qt" for="s_ref">Project reference</label>
      <p class="guide">${isNew ? 'Next available number, generated automatically. You can change it if you need to.'
                               : 'Changing this will not affect records already completed under the old reference.'}</p>
      <input type="text" id="s_ref" value="${esc(s.ref||'')}" placeholder="${REF_PREFIX}-001-${new Date().getFullYear()}">
      ${isNew ? `<button class="btn ghost" style="padding:10px;margin-top:10px;font-size:12px"
                   onclick="document.getElementById('s_ref').value=nextProjectRef()">Reset to next available</button>` : ''}
    </div>
    ${fld('address','Site address','Street, town, postcode')}
    ${fld('client','Client','Client organisation')}

  </main>
  <div class="actionbar"><div class="inner">
    <button class="btn go" onclick="saveSite()">${isNew?'Create project':'Save site details'}</button>
    ${isNew?'':`<button class="btn ghost" onclick="go('projects')">Switch project</button>`}
  </div></div>`;
}
async function saveSite(){
  const vals = {};
  ['name','ref','address','client'].forEach(k => vals[k] = $('#s_'+k).value.trim());
  if(!vals.name){ toast('Give the project a name'); $('#s_name').focus(); return; }

  if (refInUse(vals.ref, state.editing === 'new' ? null : (state.site||{}).id)){
    toast('That reference is already in use');
    $('#s_ref').focus(); return;
  }

  if (state.editing === 'new' && !CLOUD.canMakeProjects()){
    toast('Only managers and superusers can create projects'); return;
  }

  if(state.editing === 'new'){
    if (!vals.ref) vals.ref = nextProjectRef();
    vals.id = crypto.randomUUID();
    vals.ownerId = state.profile && state.profile.id;
    state.projects.unshift(vals);
    state.site = vals;
    await set('current', vals.id);
    toast('Project created');
  } else {
    Object.assign(state.site, vals);
    toast('Site details saved');
  }
  const res = await CLOUD.saveProject(state.site);
  if (res.queued) toast('Saved on this device — will sync when back online');
  // remember the highest number ever issued, so deleting a project never frees it
  const m = String(vals.ref||'').match(new RegExp('^' + REF_PREFIX + '-(\\d+)-\\d{4}$','i'));
  if (m) {
    const n = parseInt(m[1], 10);
    if (n > (state.refseq||0)){ state.refseq = n; await set('refseq', n); }
  }
  state.editing = null;
  await set('projects', state.projects);
  go('home');
}

boot();
</script>
